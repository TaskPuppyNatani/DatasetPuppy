[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasetpuppy"
version = "0.1.0"
description = "Cross-platform dataset repair, normalization, validation, and compilation tool."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7"
]

[project.scripts]
datasetpuppy = "datasetpuppy.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
